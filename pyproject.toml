[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyagentcli"
version = "0.1.0"
description = "A local Python AI coding agent CLI with ReAct, tool calling, safety approval, and audit logs."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "PyAgentCLI Contributors" }
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pyagent = "pyagentcli.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

